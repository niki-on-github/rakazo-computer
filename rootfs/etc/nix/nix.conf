# Single-user Nix: /nix is owned by uid 1000, there is no daemon.
experimental-features = nix-command flakes
build-users-group =
# The pod has no CAP_SYS_ADMIN for a build sandbox.
sandbox = false
# `nix shell nixpkgs#foo` and `<nixpkgs>` resolve through the flake registry.
nix-path = nixpkgs=flake:nixpkgs
substituters = https://cache.nixos.org
trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
# Add a cache proxy at runtime, without rebuilding the image:
#   NIX_CONFIG='extra-substituters = https://cache.example
#   extra-trusted-public-keys = cache.example:...'
# or the same lines in ~/.config/nix/nix.conf.
